name: Extension CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    name: Extension tests and syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.6.0
      - name: Tests
        run: node --test tests/*.test.cjs tests/*.test.js
      - name: Extension syntax and manifest
        run: |
          find codex-meter-extension -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e 'JSON.parse(require("node:fs").readFileSync("codex-meter-extension/manifest.json", "utf8"))'
