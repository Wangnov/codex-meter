name: Publish Chrome Web Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Upload and publish extension
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: find codex-meter-extension -maxdepth 3 -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check manifest and capture version
        id: manifest
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("codex-meter-extension/manifest.json", "utf8"));
          if (!manifest.version) throw new Error("manifest.version is required");
          console.log(`version=${manifest.version}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${manifest.version}\n`);
          NODE

      - name: Package extension
        run: |
          rm -f codex-meter-extension.zip
          (cd codex-meter-extension && zip -r ../codex-meter-extension.zip .)
          unzip -t codex-meter-extension.zip

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Upload package to Chrome Web Store
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            -X POST \
            -T codex-meter-extension.zip \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:upload"

      - name: Submit Chrome Web Store publish
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            -X POST \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish"

      - name: Show submitted version
        run: echo "Submitted Codex Meter ${{ steps.manifest.outputs.version }} to Chrome Web Store review."
