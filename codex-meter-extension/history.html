<p>每份快照的当日 Credits ÷ 消耗百分比 × 100，取有效日期的中位数。这是接口在采集当时隐含的换算基准，不保证等于官方真实周额度上限。区间反映同一快照内各日反算值的差异。</p>
<p>仅在手动刷新时记录；本页只读本机数据，不请求官方接口。长期归档独立于普通快照，清空普通历史不会删除它。卸载扩展、清除浏览器数据或更换配置文件仍会丢失，请定期导出备份。</p>
