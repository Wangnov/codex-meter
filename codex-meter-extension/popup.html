<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Codex Meter</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup" aria-labelledby="title">
      <header class="cqc-header">
        <div class="cqc-brand">
          <div id="brandIcon" class="cqc-brand-mark" aria-hidden="true"></div>
          <div>
            <h1 class="cqc-title" id="title">Codex Meter</h1>
            <p class="cqc-subtitle" data-i18n="subtitle">本地用量面板</p>
          </div>
        </div>
      </header>

      <section id="status" class="cqc-status" data-kind="info">读取本地状态...</section>

      <section class="cqc-section">
        <h2><span data-icon="database"></span><span data-i18n="sections.local">本地快照</span></h2>
        <div class="info-list">
          <article class="info-card">
            <span data-i18n="snapshot.latest">最近更新</span>
            <strong id="latestSnapshot">--</strong>
          </article>
          <article class="info-card">
            <span data-i18n="snapshot.count">历史快照</span>
            <strong id="snapshotCount">--</strong>
          </article>
        </div>
      </section>

      <p><button id="openQuotaHistory" class="cqc-text-button" type="button">额度基准历史（长期归档）</button></p>
      <footer class="cqc-footer">
        <button id="openAnalytics" class="cqc-text-button" type="button">
          <span data-icon="external"></span><span data-i18n="actions.open">打开页面</span>
        </button>
        <button id="openPanel" class="cqc-text-button cqc-primary" type="button">
          <span data-icon="gauge"></span><span data-i18n="actions.panel">打开面板</span>
        </button>
        <button id="refresh" class="cqc-icon-button" type="button" title="刷新" aria-label="刷新">
          <span data-icon="refresh"></span>
        </button>
        <button id="exportJson" class="cqc-icon-button" type="button" title="导出 JSON" aria-label="导出 JSON">
          <span data-icon="fileJson"></span>
        </button>
        <button id="clearHistory" class="cqc-icon-button" type="button" title="清空历史" aria-label="清空历史">
          <span data-icon="trash"></span>
        </button>
      </footer>
    </main>
    <script src="icons.js"></script>
    <script src="shared/config.js"></script>
    <script src="domain/usage-domain.js"></script>
    <script src="infrastructure/report-repository.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
